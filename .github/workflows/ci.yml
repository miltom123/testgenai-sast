name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valores dummy para que la validación de entorno (env.ts) pase en CI
      NODE_ENV: test
      DATABASE_URL: "postgresql://test:test@localhost:5432/calidad_test?schema=public"
      JWT_SECRET: "ci_secret_key_de_integracion_continua_1234567890"
      AI_PROVIDER_DEFAULT: gemini

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests + cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Conservar resultados de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-y-cobertura
          path: backend/coverage/

  docker:
    name: Validar build de Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen (sin publicar)
        run: docker build -f backend/Dockerfile -t testgenai:ci .
